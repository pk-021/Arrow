<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extension Settings</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>
  <div class="settings-container">
    <div class="settings-header"><h2>Extension Settings</h2></div>
    <div class="setting-item">
      <label for="extension-online">Extension online</label>
      <label class="switch"><input type="checkbox" id="extension-online" /><span class="slider"></span></label>
    </div>
    <div class="setting-item">
      <label for="redirect-subscriptions">Redirect to Subscriptions</label>
      <label class="switch"><input type="checkbox" id="redirect-subscriptions" /><span class="slider"></span></label>
    </div>
    <div class="setting-item">
      <label for="disable-shorts">Disable Shorts</label>
      <label class="switch"><input type="checkbox" id="disable-shorts" /><span class="slider"></span></label>
    </div>
  </div>
  <script src="js/core/config.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
